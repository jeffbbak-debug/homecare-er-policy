name: Build Home Care ER AIT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-homecare-er.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout build source branch
        uses: actions/checkout@v4
        with:
          ref: build-homecare-er

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore project source
        shell: bash
        run: |
          cat build-source/source.part* | tr -d '\r\n ' > homecare-er-source.b64
          echo "Base64 bytes: $(wc -c < homecare-er-source.b64)"
          echo "Base64 SHA256: $(sha256sum homecare-er-source.b64 | cut -d' ' -f1)"
          test "$(wc -c < homecare-er-source.b64)" = "28712"
          echo "c3b09458657bda0c31e145b407a76f5ee9b3aa8b05dbbf8160e641e261e9abc4  homecare-er-source.b64" | sha256sum -c -
          base64 --decode homecare-er-source.b64 > homecare-er-source.zip
          unzip -t homecare-er-source.zip
          unzip -q homecare-er-source.zip
          test -f homecare-er-live/package.json
          test -f homecare-er-live/.env.production

      - name: Install dependencies
        working-directory: homecare-er-live
        run: npm install --no-audit --no-fund

      - name: Build AIT
        working-directory: homecare-er-live
        run: npm run build

      - name: Verify AIT output
        shell: bash
        run: |
          AIT_FILE=$(find homecare-er-live -maxdepth 2 -type f -name '*.ait' | head -n 1)
          if [ -z "$AIT_FILE" ]; then
            echo 'AIT file was not generated.'
            find homecare-er-live -maxdepth 2 -type f | sort
            exit 1
          fi
          echo "AIT_FILE=$AIT_FILE" >> "$GITHUB_ENV"
          echo "Generated: $AIT_FILE"
          ls -lh "$AIT_FILE"

      - name: Upload AIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: homecareer-ait
          path: ${{ env.AIT_FILE }}
          if-no-files-found: error
          retention-days: 30
