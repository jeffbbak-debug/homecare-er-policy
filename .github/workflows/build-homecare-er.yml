name: Build Home Care ER AIT

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-homecare-er.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout build source branch
        uses: actions/checkout@v4
        with:
          ref: build-homecare-er

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Restore project source
        shell: bash
        run: |
          cat \
            build-source/source.part01 \
            build-source/source.part02 \
            build-source/source.part03a \
            build-source/source.part03b \
            build-source/source.part04 \
            build-source/source.part05 \
            build-source/source.part06 \
            | tr -d '\r\n ' > homecare-er-source.b64
          test "$(wc -c < homecare-er-source.b64)" = "28712"
          echo "c3b09458657bda0c31e145b407a76f5ee9b3aa8b05dbbf8160e641e261e9abc4  homecare-er-source.b64" | sha256sum -c -
          base64 --decode homecare-er-source.b64 > homecare-er-source.zip
          unzip -q homecare-er-source.zip
          test -f homecare-er-live/package.json
          test -f homecare-er-live/.env.production

      - name: Apply registered brand icon
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('homecare-er-live/granite.config.ts')
          text = path.read_text(encoding='utf-8')
          icon = 'https://static.toss.im/appsintoss/31187/133457d0-f71d-4295-87f9-589605a68963.png'
          text = text.replace("icon: '',", f"icon: '{icon}',")
          path.write_text(text, encoding='utf-8')
          if icon not in path.read_text(encoding='utf-8'):
              raise SystemExit('brand.icon update failed')
          print(path.read_text(encoding='utf-8'))
          PY

      - name: Install dependencies
        working-directory: homecare-er-live
        run: npm install --no-audit --no-fund

      - name: Build AIT
        working-directory: homecare-er-live
        run: npm run build

      - name: Verify AIT output
        shell: bash
        run: |
          AIT_FILE=$(find homecare-er-live -maxdepth 2 -type f -name '*.ait' | head -n 1)
          if [ -z "$AIT_FILE" ]; then
            echo 'AIT file was not generated.'
            find homecare-er-live -maxdepth 2 -type f | sort
            exit 1
          fi
          echo "AIT_FILE=$AIT_FILE" >> "$GITHUB_ENV"
          ls -lh "$AIT_FILE"

      - name: Upload AIT artifact
        uses: actions/upload-artifact@v4
        with:
          name: homecareer-ait
          path: ${{ env.AIT_FILE }}
          if-no-files-found: error
          retention-days: 30
